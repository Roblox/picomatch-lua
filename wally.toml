[package]
name = "roblox/picomatch"
description = "A Luau port of the picomatch glob-matching library (https://github.com/micromatch/picomatch)."
version = "0.4.3"
license = "MIT"
authors = ["Roblox <no-reply@roblox.com>"]
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
repository = "https://github.com/Roblox/picomatch-lua"

exclude = [
    # Tooling, configs, and meta
    "*.bak",
    ".DS_Store",
    ".github",
    ".gitattributes",
    ".gitignore",
    ".robloxrc",
    ".vscode",
    "foreman.toml",
    "mirror-ignore.txt",
    "multipack.toml",
    "rotriever.lock",
    "rotriever.toml",
    "selene.toml",
    "testez.toml",

    # Build outputs
    "Packages",
    "multipack-build",
    "*.rbxl",
    "*.rbxlx",
    "*.rbxm",
    "*.rbxmx",

    # Tests, fixtures, and dev scripts
    "bin",
    "scripts",
    "__tests__",
    "*.spec.lua",

    # Other Rojo project files — Wally consumers should only see
    # `default.project.json`. Wally 0.3.2 doesn't respect gitignore-style `!`
    # negation in exclude patterns, so we list the single file we want kept
    # out (tests.project.json) explicitly rather than relying on a glob.
    "tests.project.json",

    # LOSS prep artefacts
    "LOSS_*.md",
]

[dependencies]
LuauPolyfill = "roblox/luau-polyfill@^1.2.3"
Promise = "roblox/promise@^3.5.0"
RegExp = "roblox/regexp@^0.3.0"

[dev-dependencies]
JestGlobals = "roblox/jest-roblox@^2.4.1"
